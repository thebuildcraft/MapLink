# Map Link Velocity
#
# Tells the Map Link mod on the client which web map belongs to the server
# the player is currently on, every time the player joins or switches servers.
#
# Format:   <server name from velocity.toml> = <map type> <link>
# Map types: squaremap, bluemap, dynmap, pl3xmap, liveatlas
# Use "none" for servers without a web map.
# Servers that are not listed here use the client's own Map Link config.
#
# After editing run "/maplinkvelocity reload" (permission: maplink.reload).

# survival = squaremap https://map.example.com/
# lobby = none
